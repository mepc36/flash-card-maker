<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash Card Reviewer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="controls">
    <label for="deck-select">Deck:</label>
    <select id="deck-select"></select>
  </div>

  <div class="card" id="card">
    <div class="card-inner" id="card-inner">
      <div class="card-face card-front" id="question-text"></div>
      <div class="card-face card-back" id="answer-text"></div>
    </div>
  </div>

  <div class="progress" id="progress"></div>

  <div class="grade-buttons" id="grade-buttons">
    <button class="grade-btn grade-missed" id="missed-btn">&#10007; Missed it</button>
    <button class="grade-btn grade-correct" id="correct-btn">&#10003; Got it</button>
  </div>

  <div class="nav">
    <button id="prev-btn">&#8592; Prev</button>
    <button id="next-btn">Next &#8594;</button>
  </div>

  <div class="secondary-controls">
    <button class="repeat" id="repeat-btn">Restart deck</button>
    <button class="repeat" id="review-btn">Review missed (0)</button>
  </div>

  <script>
    // Cache-bust so GitHub Pages' cached copies never show stale questions.
    // app.js loads only after questions.js finishes, to preserve load order.
    (function () {
      var bust = "?t=" + Date.now();
      var questionsScript = document.createElement("script");
      questionsScript.src = "js/questions.js" + bust;
      questionsScript.onload = function () {
        var appScript = document.createElement("script");
        appScript.src = "js/app.js" + bust;
        document.body.appendChild(appScript);
      };
      document.body.appendChild(questionsScript);
    })();
  </script>
</body>
</html>
