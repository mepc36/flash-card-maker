<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash Card Reviewer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="controls">
    <select id="group-select" aria-label="Company"></select>
    <select id="deck-select" aria-label="Deck" disabled></select>
  </div>

  <p class="empty-state" id="empty-state">Pick a company, then a deck, to begin.</p>

  <div class="deck-session" id="deck-session" hidden>
    <div class="card" id="card">
      <div class="card-inner" id="card-inner">
        <div class="card-face card-front" id="question-text"></div>
        <div class="card-face card-back" id="answer-text"></div>
      </div>
    </div>

    <div class="progress" id="progress"></div>

    <div class="grade-buttons" id="grade-buttons">
      <button class="grade-btn grade-missed" id="missed-btn">&#10007; Missed it</button>
      <button class="grade-btn grade-correct" id="correct-btn">&#10003; Got it</button>
    </div>

    <div class="nav">
      <button id="prev-btn">&#8592; Prev</button>
      <button id="next-btn">Next &#8594;</button>
    </div>

    <div class="secondary-controls">
      <button class="repeat" id="repeat-btn">Restart deck</button>
      <button class="repeat" id="review-btn">Review missed (0)</button>
    </div>
  </div>

  <script>
    // Cache-bust so GitHub Pages' cached copies never show stale questions.
    // Scripts load one at a time in this order: every deck file, then
    // questions.js (groups the decks), then app.js.
    (function () {
      var DECK_FILES = [
        "js/decks/livekit/livekit-rapbot.js",
        "js/decks/livekit/livekit-prism.js",
        "js/decks/livekit/livekit-navient.js",
        "js/decks/livekit/livekit-ai-workflow.js",
        "js/decks/deepgram-research/deepgram-research-training-pipeline.js",
        "js/decks/deepgram/deepgram-faq.js",
        "js/decks/deepgram/deepgram-statistics.js",
        "js/decks/deepgram/rapbot-model-eval.js",
        "js/decks/deepgram/navient-twilio.js",
        "js/decks/deepgram/nbcu-hr-agent.js",
        "js/decks/nebius/nebius-sme-1.js",
        "js/decks/nebius/nebius-tech-tutorials.js",
        "js/decks/nebius/nebius-cli-tools.js",
        "js/decks/nebius/nebius-sme-misc.js",
        "js/decks/service-titan/service-titan-algorithms.js",
        "js/decks/coding-review/coding-review-js-to-python.js"
      ];
      var scriptPaths = DECK_FILES.concat(["js/questions.js", "js/app.js"]);
      var bust = "?t=" + Date.now();
      function loadScript(index) {
        if (index >= scriptPaths.length) return;
        var script = document.createElement("script");
        script.src = scriptPaths[index] + bust;
        script.onload = function () { loadScript(index + 1); };
        document.body.appendChild(script);
      }
      loadScript(0);
    })();
  </script>
</body>
</html>
